name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: arbitri_app_ci
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: arbitri_app_ci
      DB_USER: root
      DB_PASS: root
      DB_CHARSET: utf8mb4
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      JWT_ISSUER: arbitri-app-ci
      JWT_EXPIRE: 3600
      FOOTBALL_SYNC_ENCRYPTION_KEY: ci-only-sync-key-with-at-least-32-characters
      ADMIN_USERNAME: ci_admin
      ADMIN_PASSWORD: ci-admin-password-123
      ADMIN_FIRST_NAME: CI
      ADMIN_LAST_NAME: Admin
      ADMIN_EMAIL: ci-admin@example.test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, openssl
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Lint PHP
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find admin/js -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Install MariaDB client when needed
        shell: bash
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes mariadb-client
          fi

      - name: Build CI database
        shell: bash
        run: |
          export MYSQL_PWD="$DB_PASS"
          mysql_ci() {
            {
              echo "SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci;"
              cat "$1"
            } | mysql \
                --host="$DB_HOST" \
                --port="$DB_PORT" \
                --user="$DB_USER" \
                --default-character-set=utf8mb4 \
                "$DB_NAME"
          }
          mysql_ci database/baseline/2026_09_05_schema.sql
          mysql_ci database/seeds/2026_09_05_reference_data.sql
          php database/bootstrap_admin.php
          mysql_ci database/migrations/2026_07_13_rebuild_financial_categories.sql
          mysql_ci database/migrations/2026_07_13_seed_2025_2026_competitions_teams.sql
          mysql_ci database/migrations/2026_07_13_seed_2025_2026_movements.sql
          mysql_ci database/migrations/2026_07_13_seed_2025_2026_matches.sql

      - name: Run standalone smoke tests
        run: |
          php tests/smoke/wordpress_football_sync_normalizer_smoke.php
          php tests/smoke/wordpress_football_sync_phase3_smoke.php
          php tests/smoke/wordpress_sync_import_phase4_smoke.php

      - name: Run database smoke tests
        run: |
          php tests/smoke/users_smoke.php
          php tests/smoke/designations_smoke.php
          php tests/smoke/referee_availabilities_smoke.php
          php tests/smoke/operational_notifications_smoke.php
